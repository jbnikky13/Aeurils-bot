name: Aeurils Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - run: python -m compileall -q trade_bot
      - run: |
          python - <<'PY'
          from trade_bot.whale_engine import classify_flow
          from trade_bot.signal_engine import combine_scores
          assert classify_flow('exchange','whale') == 'ACCUMULATION'
          assert classify_flow('whale','exchange') == 'DISTRIBUTION'
          assert combine_scores(100,100,100) == 100
          print('Aeurils core smoke test passed')
          PY

  provider-health:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Validate configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          WHALE_API_KEY: ${{ secrets.WHALE_API_KEY }}
        run: python -m trade_bot.healthcheck

  daily-telegram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: provider-health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Send daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          WHALE_API_KEY: ${{ secrets.WHALE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          WATCHLIST_CRYPTO: ${{ vars.WATCHLIST_CRYPTO }}
          WATCHLIST_STOCKS: ${{ vars.WATCHLIST_STOCKS }}
          TOKEN_CONTRACTS: ${{ vars.TOKEN_CONTRACTS }}
          WHALE_WALLETS: ${{ vars.WHALE_WALLETS }}
          EXCHANGE_WALLETS: ${{ vars.EXCHANGE_WALLETS }}
          MIN_SIGNAL_SCORE: ${{ vars.MIN_SIGNAL_SCORE }}
        run: python -m trade_bot.run_daily
