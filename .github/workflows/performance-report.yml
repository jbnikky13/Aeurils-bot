name: Aeurils Performance Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Restore persistent paper ledger
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence restore
      - name: Build and send performance report
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m trade_bot.telegram_report
