name: Aeurils Daily Signal Service

on:
  schedule:
    # Africa/Lagos (WAT, UTC+1): 09:30, 14:30 and 18:30.
    # GitHub Actions cron is UTC, so these are 08:30, 13:30 and 17:30 UTC.
    - cron: '30 8 * * *'
    - cron: '30 13 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurelis-daily-signal-service
  cancel-in-progress: false

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scheduled-run heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat:
              raise SystemExit('Telegram secrets are missing')
          now = datetime.now(timezone.utc)
          text = (
              '🟢 AURELIS SCHEDULED SCAN STARTED\n\n'
              f'UTC: {now:%Y-%m-%d %H:%M:%S}\n'
              'WAT: scheduled scan is now running.'
          )
          data = urllib.parse.urlencode({'chat_id': chat, 'text': text}).encode()
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              payload = json.loads(response.read().decode())
          if not payload.get('ok'):
              raise SystemExit(f"Telegram heartbeat failed: {payload}")
          print('Telegram scheduled-run heartbeat delivered successfully.')
          PY

      - run: pip install -r trade_bot/requirements.txt
      - name: Restore persistent paper ledger
        env:
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence restore
      - name: Run daily signal
        env:
          DATABASE_PATH: trade_bot.db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SIGNAL_SCORE: '70'
          MIN_CONFLUENCES: '6'
          DAILY_FALLBACK_MIN_CONFLUENCES: '4'
          MAX_DAILY_ACTIONABLE_SIGNALS: '1'
          MARKET_DATA_CONCURRENCY: '12'
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.daily_service
      - name: Persist paper ledger
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence
      - name: Commit paper ledger
        run: |
          git config user.name 'aurelis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aurelis_paper_ledger.json
          git diff --cached --quiet || git commit -m 'chore: persist AURELIS paper ledger'
          git push
