name: AURELIS Paper Trade Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurelis-paper-trade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Restore persistent paper ledger
        env:
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence restore
      - name: Evaluate open paper trades with 5m candles
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_RESOLUTION: '5m'
          MAX_HOLD_HOURS: '24'
        run: python -m trade_bot.intraday_paper_monitor
      - name: Persist updated paper ledger
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence
      - name: Commit paper-trade results
        run: |
          set -euo pipefail
          git config user.name 'aurelis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aurelis_paper_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update AURELIS paper-trade results'
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            sleep $((attempt * 5))
          done
          exit 1
