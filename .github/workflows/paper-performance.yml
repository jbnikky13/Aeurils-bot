name: Aeurils Paper Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Run paper performance analytics
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_FEE_BPS_PER_SIDE: '10'
        run: |
          mkdir -p reports
          python -m trade_bot.paper_analytics | tee reports/paper-performance.txt
          python -m trade_bot.paper_analytics > reports/paper-performance.json
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-paper-performance
          path: reports/paper-performance.*
          retention-days: 30
