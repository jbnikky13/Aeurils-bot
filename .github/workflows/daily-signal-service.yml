name: Aeurils Daily Signal Service

on:
  schedule:
    # Africa/Lagos (WAT, UTC+1): 08:30, 13:30 and 19:30.
    # GitHub Actions cron is UTC, so these are 07:30, 12:30 and 18:30 UTC.
    - cron: '30 7 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurelis-daily-signal-service
  cancel-in-progress: false

env:
  MAX_HOLD_HOURS: '24'

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scheduled-run heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          token=os.environ.get('TELEGRAM_BOT_TOKEN'); chat=os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat: raise SystemExit('Telegram secrets are missing')
          now=datetime.now(timezone.utc)
          text=f'🟢 AURELIS SCHEDULED SCAN STARTED\n\nUTC: {now:%Y-%m-%d %H:%M:%S}\nWAT: {now:%H:%M} + 1h\n\nStrategy scan is running.'
          data=urllib.parse.urlencode({'chat_id':chat,'text':text}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=15) as response: payload=json.loads(response.read().decode())
          if not payload.get('ok'): raise SystemExit(f'Telegram heartbeat failed: {payload}')
          PY

      - name: Install dependencies
        run: pip install -r trade_bot/requirements.txt
      - name: Restore persistent paper ledger
        env:
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence restore
      - name: Run daily signal
        env:
          DATABASE_PATH: trade_bot.db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SIGNAL_SCORE: '70'
          MIN_CONFLUENCES: '6'
          DAILY_FALLBACK_MIN_CONFLUENCES: '6'
          MAX_DAILY_ACTIONABLE_SIGNALS: '1'
          MARKET_DATA_CONCURRENCY: '12'
          MAX_HOLD_HOURS: '24'
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.daily_service
      - name: Persist paper ledger
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: python -m trade_bot.paper_persistence
      - name: Commit paper ledger
        run: |
          git config user.name 'aurelis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aurelis_paper_ledger.json
          git diff --cached --quiet || git commit -m 'chore: persist AURELIS paper ledger'
          git push
