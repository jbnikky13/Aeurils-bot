name: Aeurils Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - run: python -m compileall -q trade_bot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: |
          python - <<'PY'
          from trade_bot.whale_engine import classify_flow
          from trade_bot.signal_engine import combine_scores
          assert classify_flow('exchange','whale') == 'ACCUMULATION'
          assert classify_flow('whale','exchange') == 'DISTRIBUTION'
          assert combine_scores(100,100,100) == 100
          print('Aurelis core smoke test passed')
          PY

  provider-health:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Validate configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          WHALE_API_KEY: ${{ secrets.WHALE_API_KEY }}
        run: python -m trade_bot.healthcheck
