name: Aeurils Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r trade_bot/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q trade_bot
      - name: Smoke-test imports
        run: python - <<'PY'
from trade_bot.whale_engine import classify_flow
from trade_bot.signal_engine import combine_scores
assert classify_flow('exchange','whale') == 'ACCUMULATION'
assert combine_scores(100, 100, 100) == 100
print('Aeurils core smoke test passed')
PY
