name: Aeurils Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - run: python -m compileall -q trade_bot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Restore ledger and generate Telegram preview (no delivery)
        env:
          DATABASE_PATH: trade_bot.db
          PAPER_LEDGER_PATH: data/aurelis_paper_ledger.json
        run: |
          python -m trade_bot.paper_persistence restore
          python -m trade_bot.fv1_preview > data/aurelis_telegram_preview.txt
      - name: Upload Telegram preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-telegram-preview
          path: data/aurelis_telegram_preview.txt
          if-no-files-found: error
      - name: Paper-filter chronological holdout (research only)
        run: python -m trade_bot.paper_filter_validation
      - run: |
          python - <<'PY'
          from trade_bot.whale_engine import classify_flow
          from trade_bot.signal_engine import combine_scores
          assert classify_flow('exchange','whale') == 'ACCUMULATION'
          assert classify_flow('whale','exchange') == 'DISTRIBUTION'
          assert combine_scores(100,100,100) == 100
          print('Aurelis core smoke test passed')
          PY

  provider-health:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Validate configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          WHALE_API_KEY: ${{ secrets.WHALE_API_KEY }}
        run: python -m trade_bot.healthcheck
