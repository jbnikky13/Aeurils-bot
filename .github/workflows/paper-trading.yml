name: Aeurils Paper Trading Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r trade_bot/requirements.txt
      - name: Initialize paper ledger
        env:
          DATABASE_PATH: trade_bot.db
        run: python -c "from trade_bot.paper_trader import init_paper_db, paper_summary; init_paper_db(); print(paper_summary())"
