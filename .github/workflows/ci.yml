name: Aeurils Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r trade_bot/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q trade_bot
      - name: Smoke-test imports
        run: |
          python - <<'PY'
          from trade_bot.whale_engine import classify_flow
          from trade_bot.signal_engine import combine_scores
          assert classify_flow('exchange','whale') == 'ACCUMULATION'
          assert classify_flow('whale','exchange') == 'DISTRIBUTION'
          assert combine_scores(100, 100, 100) == 100
          print('Aeurils core smoke test passed')
          PY

  provider-health:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r trade_bot/requirements.txt
      - name: Validate required configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          WHALE_API_KEY: ${{ secrets.WHALE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          required = ['TELEGRAM_BOT_TOKEN','GEMINI_API_KEY','STOCK_API_KEY','WHALE_API_KEY']
          missing = [x for x in required if not os.getenv(x)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          print('Required provider secrets are configured')
          PY
